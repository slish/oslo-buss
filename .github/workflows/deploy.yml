name: Publiser

# Publiserer til Cloudflare når main endrar seg, etter at typesjekk og testar er grøne. Treng to hemmelegheiter i repoet
# (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN og CLOUDFLARE_ACCOUNT_ID. Utan dei køyrer
# sjekkane, men ingenting blir publisert. Sjå docs/HOSTING.md.
#
# Tidstabellen høyrer ikkje til her: Worker-en les han frå grenen `data` (workflow: Tidstabell).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/timetable.yml'
  workflow_dispatch:

permissions:
  contents: read

# Éin publisering om gongen, og ei som ventar blir ikkje avbroten midt i opplastinga.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Kartverket tiles are a finished artifact on the `tiles` branch (npm run kartverket:publish). Without the branch the site still builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: tiles
        continue-on-error: true
        with:
          ref: tiles
          path: public/kartverket-tiles
      - run: |
          rm -rf public/kartverket-tiles/.git
          if [ -d public/kartverket-tiles/fine ]; then mv public/kartverket-tiles/fine public/kartverket-tiles-fine; fi
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Publiser til Cloudflare
        if: env.HAS_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Utan Cloudflare-hemmelegheiter
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN og CLOUDFLARE_ACCOUNT_ID manglar, så ingenting vart publisert."

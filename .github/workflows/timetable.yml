name: Tidstabell

# Bygger public/data/timetable.json frå Entur sin GTFS for Ruter kvart døgn, sjekkar han, og legg han på grenen `data`.
# Entur lagar ny GTFS-fil ved midnatt (UTC); 03:30 UTC gir god margin. Grenen `data` er éi enkelt commit som blir
# skriven over kvar gong, så historikken veks ikkje. Relayen les fila derifrå (eller frå artefakten).
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      lines:
        description: 'Linjer (skilde med mellomrom), til dømes "20 31 63". Tomt gir standardlista i scripts/build-timetable.ts.'
        required: false
        default: ''
      restore:
        description: 'Gå tilbake til tidstabellen frå ein dato, til dømes "2026-11-12" (ei av dei siste 7 dagane på grenen data). Tomt bygger ein ny.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: timetable
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Bygg tidstabellen
        if: inputs.restore == ''
        run: npm run timetable -- --fresh $LINES
        env:
          LINES: ${{ inputs.lines }}
      - name: Sjekk at han er fornuftig
        if: inputs.restore == ''
        run: npm run check-timetable
      - if: inputs.restore == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: timetable
          path: public/data/timetable.json
          retention-days: 7
      - name: Publiser til grenen data
        run: |
          mkdir "$RUNNER_TEMP/kept"
          # The last days' timetables stay on the branch as dated files, so that there is something to go back to.
          if git fetch --quiet --depth=1 origin data; then
            git ls-tree --name-only FETCH_HEAD | grep -E '^timetable-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | while read -r f; do git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/kept/$f"; done
          fi
          if [ -n "$RESTORE" ]; then
            [ -f "$RUNNER_TEMP/kept/timetable-$RESTORE.json" ] || { echo "::error::Fann ingen tidstabell frå $RESTORE på grenen data"; exit 1; }
            cp "$RUNNER_TEMP/kept/timetable-$RESTORE.json" "$RUNNER_TEMP/timetable.json"
          else
            cp public/data/timetable.json "$RUNNER_TEMP/timetable.json"
            cp "$RUNNER_TEMP/timetable.json" "$RUNNER_TEMP/kept/timetable-$(date -u +%F).json"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf . --quiet
          cp "$RUNNER_TEMP/timetable.json" timetable.json
          cp "$RUNNER_TEMP"/kept/timetable-*.json . 2>/dev/null || true
          ls -1 timetable-*.json | sort -r | tail -n +8 | xargs -r rm
          # Only the timetables: after `git rm` the .gitignore is gone, and a plain `git add .` would take node_modules along.
          git add timetable.json timetable-*.json
          git commit --quiet -m "Tidstabell $(date -u +%F)${RESTORE:+ (tilbake til $RESTORE)}"
          git push --force origin data
        env:
          RESTORE: ${{ inputs.restore }}
